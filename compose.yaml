services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hockey_timer}
      POSTGRES_USER: ${POSTGRES_USER:-hockey_timer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hockey_timer}
    volumes:
      - api-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  api:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        ENV NODE_ENV=production
        COPY package.json package-lock.json ./
        COPY backend/services/events/package.json backend/services/events/package.json
        COPY shared/event-schema/package.json shared/event-schema/package.json
        COPY shared/replay-engine/package.json shared/replay-engine/package.json
        RUN npm ci --omit=dev --workspace @hockey-timer/events-service --include-workspace-root=false
        COPY backend/services/events/local-server.mjs backend/services/events/local-server.mjs
        EXPOSE 8787
        CMD ["node", "backend/services/events/local-server.mjs"]
    environment:
      PORT: "8787"
      STORAGE_DRIVER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-hockey_timer}:${POSTGRES_PASSWORD:-hockey_timer}@db:5432/${POSTGRES_DB:-hockey_timer}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8787:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-alpine AS build
        WORKDIR /app
        COPY package.json package-lock.json ./
        COPY tsconfig.base.json ./
        COPY apps/web/package.json apps/web/package.json
        COPY backend/services/events/package.json backend/services/events/package.json
        COPY shared/event-schema/package.json shared/event-schema/package.json
        COPY shared/replay-engine/package.json shared/replay-engine/package.json
        RUN npm ci
        COPY apps/web apps/web
        RUN npm run build:web

        FROM nginx:1.27-alpine
        COPY --from=build /app/apps/web/dist /usr/share/nginx/html
        EXPOSE 80
        CMD ["/bin/sh", "-c", "printf 'globalThis.__API_BASE__ = \"%s\";\\n' \"$${WEB_API_BASE:-http://localhost:8787}\" > /usr/share/nginx/html/config.js && nginx -g 'daemon off;'"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      WEB_API_BASE: ${WEB_API_BASE:-http://localhost:8787}
    ports:
      - "4173:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  api-db-data:
